<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="auto">
<meta name="description" content="narra iOS 客户端测试版和正式版界面演示：两版各一套英文版真实截图（iPhone 17 Pro 模拟器），标注构建时间和截图时间，可切换显示编号框">
<title>narra 测试版和正式版</title>
<style>
:root{--ink:#1F2329;--sub:#4E5969;--pur:#7B61E8;--purd:#5B3FD0;--purf:#F3EFFF;--gry:#F5F6F7;--line:#E3E5E8;--blk:#16181D;--grn:#1F9D55;--grnf:#E8F6EE;--org:#C26A00;--orgf:#FFF3E0}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Helvetica,Arial,sans-serif}
.app{width:100%;height:800px;display:flex;flex-direction:column;border:1px dashed #C9CDD4;border-radius:12px;overflow:hidden;background:#fff}
header{display:flex;align-items:center;gap:10px;padding:12px 130px 10px 16px;flex:none;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--pur);flex:none}
h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap}h1 b{color:var(--pur)}
.seg{display:flex;background:var(--gry);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;font:inherit;border-radius:8px;padding:4px 12px;cursor:pointer;text-align:left;color:var(--sub);line-height:1.3}
.seg button b{display:block;font-size:13.5px;color:var(--ink)}
.seg button small{font-size:11.5px;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg button[aria-pressed="true"] b{color:var(--purd)}
.sw{display:flex;align-items:center;gap:8px;border:0;background:none;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;padding:4px 2px}
.sw .tr{width:36px;height:20px;border-radius:999px;background:#C9CDD4;position:relative;transition:background .15s;flex:none}
.sw .kn{position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw[aria-checked="true"] .tr{background:var(--pur)}.sw[aria-checked="true"] .kn{transform:translateX(16px)}
.sp{flex:1}
.count{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
button:focus-visible{outline:2px solid var(--pur);outline-offset:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#FBFBFC;font-size:12.5px;color:var(--sub);flex:none}
.meta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.meta .tag{border-radius:5px;padding:0 7px;font-weight:700;font-size:12px}
.tag.test{background:var(--orgf);color:var(--org)}.tag.prod{background:var(--grnf);color:var(--grn)}
.body{flex:1;display:flex;min-height:0}
.nav{width:186px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:10px 8px;background:#FBFBFC}
.nav .st{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;font-weight:700;font-size:13px;padding:7px 8px;border-radius:8px;cursor:pointer;color:var(--ink)}
.nav .st span{display:inline-block;background:var(--blk);color:#fff;border-radius:5px;font-size:11px;padding:1px 6px;margin-right:7px;font-variant-numeric:tabular-nums}
.nav .st.on{background:var(--purf)}
.nav .sc{display:none;margin:2px 0 6px 0;padding-left:14px}
.nav .st.on + .sc{display:block}
.nav .sc button{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;font-size:12.5px;color:var(--sub);padding:5px 8px;border-radius:0 6px 6px 0;cursor:pointer;border-left:2px solid var(--line)}
.nav .sc button.on{color:var(--purd);font-weight:700;border-left-color:var(--pur);background:#fff}
.nav .sc em{font-style:normal;font-size:10.5px;color:var(--org);background:var(--orgf);border-radius:4px;padding:0 4px;margin-left:4px;font-weight:600;white-space:nowrap}
.stage{flex:none;width:336px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--gry);padding:10px 4px}
.arrow{width:26px;height:44px;border:0;background:#fff;border-radius:8px;cursor:pointer;color:var(--ink);font-size:18px;line-height:1;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.arrow:disabled{opacity:.3;cursor:default}
.phone{position:relative;width:276px;aspect-ratio:402/874;border-radius:26px;overflow:hidden;background:#0d0d12;box-shadow:0 6px 20px rgba(20,20,40,.18);flex:none}
.phone img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity .15s;color:#fff;font-size:12px}
.ov{position:absolute;inset:0}
.mk{position:absolute;border:2px solid var(--pur);border-radius:7px;background:rgba(123,97,232,.12);opacity:0;transition:opacity .12s;pointer-events:none}
.mk b{position:absolute;left:-9px;top:-9px;min-width:20px;height:20px;border-radius:10px;background:var(--pur);color:#fff;font-size:11.5px;line-height:17px;text-align:center;border:1.5px solid #fff;font-weight:700;padding:0 3px}
.show .mk,.mk.peek{opacity:1}
.mk.peek{border-color:#FFB020;background:rgba(255,176,32,.18)}.mk.peek b{background:#E08A00}
.info{flex:1;min-width:0;display:flex;flex-direction:column;padding:12px 16px}
.crumb{font-size:12px;color:var(--sub)}
.crumb time{font-variant-numeric:tabular-nums;color:var(--ink)}
h2{font-size:18px;margin:2px 0 4px;font-weight:700}
.note{margin:0 0 6px;color:var(--ink);font-size:13.5px}
.miss{display:none;margin:0 0 8px;padding:6px 10px;border-radius:8px;background:var(--orgf);color:var(--org);font-size:12.5px}
.legend{flex:1;overflow:auto;margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.legend li{display:flex;gap:9px;padding:7px 4px;border-bottom:1px solid var(--line);cursor:default}
.legend li:hover{background:var(--purf)}
.legend .n{flex:none;width:21px;height:21px;border-radius:50%;background:var(--pur);color:#fff;font-size:11.5px;font-weight:700;line-height:21px;text-align:center;margin-top:1px}
.legend .t{min-width:0}.legend .t b{display:block;font-size:13.5px;overflow-wrap:anywhere}.legend .t span{color:var(--sub);font-size:12.5px;display:block}
.tip{font-size:12px;color:var(--sub);margin:8px 0 0}
@media (max-width:640px){
 .app{height:auto;border:0}header{padding-right:16px}
 .body{flex-direction:column}
 .nav{width:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px}
 .nav .st{width:auto;white-space:nowrap;flex:none;background:var(--gry)}.nav .sc,.nav .st.on + .sc{display:none}
 .stage{width:auto}.legend{max-height:260px}h1{font-size:15px}.count{display:none}
}
@media (prefers-reduced-motion:reduce){.mk,.sw .tr,.sw .kn{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <span class="dot"></span><h1><b>narra</b> · 客户端测试版 / 正式版</h1>
    <div class="seg" id="seg" role="group" aria-label="选择版本"></div>
    <button class="sw" id="sw" type="button" role="switch" aria-checked="false"><span class="tr"><span class="kn"></span></span><span>编号框</span></button>
    <span class="sp"></span><span class="count" id="count"></span>
  </header>
  <div class="meta" id="meta"></div>
  <div class="body">
    <nav class="nav" id="nav" aria-label="步骤和界面"></nav>
    <div class="stage">
      <button class="arrow" id="prev" type="button" aria-label="上一个界面">‹</button>
      <div class="phone"><img id="img" alt=""><div class="ov" id="ov"></div></div>
      <button class="arrow" id="next" type="button" aria-label="下一个界面">›</button>
    </div>
    <aside class="info">
      <div class="crumb" id="crumb"></div>
      <h2 id="title"></h2>
      <p class="miss" id="miss"></p>
      <p class="note" id="note"></p>
      <ul class="legend" id="legend"></ul>
      <p class="tip">iOS 客户端英文版真实界面（iPhone 17 Pro 模拟器）。编号框按界面上能点、能输入的元素自动标出，鼠标移到说明上会在截图里高亮。</p>
    </aside>
  </div>
</div>
<script>
var V=/*DATA*/[];
var ei=0,cur=0,show=false,flat=[];
var $=function(id){return document.getElementById(id);};
function pad(n){return n<10?'0'+n:''+n;}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function yr(b){return (b.captured_from||'').slice(0,4)||'2026';}
function bt(b){return b.build_time?(b.build_time.length<=11?yr(b)+'-'+b.build_time:b.build_time):'';}
function keys(v){var s={};v.data.forEach(function(st){st.screens.forEach(function(c){s[c.key]=1;});});return s;}
function other(){return V[ei===0?1:0];}
function buildSeg(){var seg=$('seg');seg.innerHTML='';V.forEach(function(v,i){var b=el('button');b.type='button';b.setAttribute('aria-pressed',i===ei?'true':'false');
  b.appendChild(el('b',null,v.label));b.appendChild(el('small',null,'构建 '+bt(v.build)));b.onclick=function(){switchEnv(i);};seg.appendChild(b);});}
function buildMeta(){var v=V[ei],b=v.build,m=$('meta');m.innerHTML='';
  m.appendChild(el('span','tag '+v.env,v.label));
  function kv(k,val){var s=el('span');s.appendChild(document.createTextNode(k+' '));s.appendChild(el('b',null,val));m.appendChild(s);}
  kv('构建时间',bt(b));kv('构建号',String(b.build_number||''));kv('代码',(b.git_sha||'')+(b.branch?' · '+b.branch:''));
  kv('截图时间',(b.captured_from||'')+(b.captured_to&&b.captured_to!==b.captured_from?' – '+b.captured_to.slice(-5):''));
  kv('后端',v.env==='prod'?'正式环境（首版正式剧目）':'测试环境（全部剧目）');}
function buildNav(){var v=V[ei],ok=other()?keys(other()):null,nav=$('nav');nav.innerHTML='';flat=[];
  v.data.forEach(function(s,i){s.screens.forEach(function(c,j){flat.push({s:i,c:j});});
    var b=el('button','st');b.type='button';b.appendChild(el('span',null,pad(i+1)));b.appendChild(document.createTextNode(s.step));
    b.onclick=function(){go(flat.findIndex(function(f){return f.s===i;}));};nav.appendChild(b);
    var box=el('div','sc');s.screens.forEach(function(c,j){var x=el('button',null,c.name);x.type='button';
      if(ok&&!ok[c.key])x.appendChild(el('em',null,'仅'+v.label));
      x.onclick=function(){go(flat.findIndex(function(f){return f.s===i&&f.c===j;}));};box.appendChild(x);});nav.appendChild(box);});}
function switchEnv(i){if(i===ei)return;var f=flat[cur],from=V[ei].data[f.s],key=from.screens[f.c].key,step=from.step;ei=i;buildSeg();buildMeta();buildNav();
  var k=-1,miss='';V[ei].data.forEach(function(s,a){s.screens.forEach(function(c,b){if(k<0&&c.key===key)k=flat.findIndex(function(x){return x.s===a&&x.c===b;});});});
  if(k<0){miss=V[ei].label+'没有「'+from.screens[f.c].name+'」这个界面，';var a=V[ei].data.findIndex(function(s){return s.step===step;});
    if(a>=0){k=flat.findIndex(function(x){return x.s===a;});miss+='已跳到同一步骤的第一个界面。';}else{k=0;miss+='整个「'+step+'」步骤也没有，已回到第一个界面。';}}
  cur=k;render(miss);}
function go(k){if(k<0||k>=flat.length)return;cur=k;render('');}
function render(miss){var v=V[ei],f=flat[cur],st=v.data[f.s],sc=st.screens[f.c];
  var im=$('img');if(im.getAttribute('src')!==sc.img){im.style.opacity='0';$('ov').style.visibility='hidden';im.onload=function(){im.style.opacity='1';$('ov').style.visibility='visible';};im.onerror=function(){im.alt='图片没加载出来，点左右箭头再试';im.style.opacity='1';};im.src=sc.img;}
  im.alt=v.label+' · '+sc.name+'（英文版界面截图）';
  var cr=$('crumb');cr.innerHTML='';cr.appendChild(document.createTextNode(pad(f.s+1)+' '+st.step+' · 第 '+(f.c+1)+' / '+st.screens.length+' 个界面 · 截图于 '));cr.appendChild(el('time',null,sc.at||''));
  $('title').textContent=sc.name;$('note').textContent=sc.note||'';$('count').textContent=v.label+' '+(cur+1)+' / '+flat.length;
  var ms=$('miss');ms.textContent=miss||'';ms.style.display=miss?'block':'none';
  var ov=$('ov');ov.innerHTML='';var lg=$('legend');lg.innerHTML='';
  sc.marks.forEach(function(m,i){var d=el('div','mk');d.style.left=(m.r[0]/402*100)+'%';d.style.top=(m.r[1]/874*100)+'%';d.style.width=(m.r[2]/402*100)+'%';d.style.height=(m.r[3]/874*100)+'%';d.appendChild(el('b',null,String(i+1)));ov.appendChild(d);
    var li=el('li');li.appendChild(el('span','n',String(i+1)));var t=el('div','t');t.appendChild(el('b',null,m.n));t.appendChild(el('span',null,m.d));li.appendChild(t);
    li.onmouseenter=function(){d.classList.add('peek');};li.onmouseleave=function(){d.classList.remove('peek');};li.onclick=function(){d.classList.toggle('peek');};lg.appendChild(li);});
  ov.parentNode.classList.toggle('show',show);
  var sts=document.querySelectorAll('.nav .st');for(var i=0;i<sts.length;i++){sts[i].classList.toggle('on',i===f.s);}
  var boxes=document.querySelectorAll('.nav .sc');for(var a=0;a<boxes.length;a++){var bs=boxes[a].children;for(var b=0;b<bs.length;b++){bs[b].classList.toggle('on',a===f.s&&b===f.c);}}
  $('prev').disabled=cur===0;$('next').disabled=cur===flat.length-1;
  if(flat[cur+1]){var n=flat[cur+1];var p=new Image();p.src=v.data[n.s].screens[n.c].img;}}
$('sw').onclick=function(){show=!show;this.setAttribute('aria-checked',show?'true':'false');$('ov').parentNode.classList.toggle('show',show);};
$('prev').onclick=function(){go(cur-1);};$('next').onclick=function(){go(cur+1);};
document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')go(cur-1);else if(e.key==='ArrowRight')go(cur+1);});
if(V.length){buildSeg();buildMeta();buildNav();render('');}
</script>
</body>
</html>
