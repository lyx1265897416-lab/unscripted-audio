<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Interactive audio series. Every episode ends with your choice, and the next one is written live.">
<title>Unscripted Audio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF5B4E'/%3E%3Cstop offset='1' stop-color='%23FFB547'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cg stroke='%230B0B0F' stroke-width='3' stroke-linecap='round'%3E%3Cpath d='M9 13v6M14 9v14M19 12v8M24 14v4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://storage.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- fonts never block the first paint (Google Fonts can be slow/blocked on some networks; system fonts show until they arrive) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script>
/* start finding the relay before app.js has even downloaded; app.js picks this promise up */
window.__relayP = fetch('relay.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
try { var b = localStorage.getItem('ua.relay'); if (b) { b = JSON.parse(b); var l = document.createElement('link'); l.rel = 'preconnect'; l.href = b; l.crossOrigin = ''; document.head.appendChild(l); } } catch (e) {}
</script>
<link rel="stylesheet" href="style.css?v=31">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ua-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5B4E"/><stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <radialGradient id="ua-coin" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#FFE7A3"/><stop offset=".55" stop-color="#FFC24B"/><stop offset="1" stop-color="#E8892A"/>
    </radialGradient>
  </defs>
</svg>

<div id="app" class="app">
  <main id="views">
    <section class="view" id="v-home" aria-label="Home"></section>
    <section class="view" id="v-explore" aria-label="Explore"></section>
    <section class="view" id="v-library" aria-label="Library"></section>
    <section class="view" id="v-rewards" aria-label="Rewards"></section>
  </main>

  <section id="detail" class="page" aria-label="Series"></section>

  <div id="mini" class="mini" hidden></div>
  <nav id="tabbar" class="tabbar" aria-label="Main"></nav>

  <section id="player" class="player" aria-label="Player" aria-hidden="true"></section>

  <div id="sheets" class="sheets"><div class="scrim" data-act="scrim"></div></div>
  <div id="call" class="call" hidden aria-live="polite"></div>
  <section id="trv" class="trv" hidden aria-label="Call transcript"></section>
  <div id="onboard" class="onboard" hidden></div>
  <div id="ad" class="ad" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <audio id="voice" preload="auto" playsinline webkit-playsinline></audio>
</div>

<script src="i18n.js?v=31"></script>
<script src="app.js?v=31"></script>
</body>
</html>
